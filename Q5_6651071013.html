<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Định dạng văn bản</title>
</head>

<body>

<h2 align="center" style="color: green;">
    Định dạng văn bản
</h2>

<p>
    <b><u>Hóa học:</u></b>
    <i>Nước</i>: <span style="color: #FF0000;">H<sub>2</sub>O</span> ; <i>Axít Sunfuric</i>:
    <span style="color: #FF0000;">H<sub>2</sub>SO<sub>4</sub></span>
</p>

<p>
    <b><u>Toán học:</u></b>
    <i>Phương trình bậc 2</i>:
    <span style="color: #FF0000;">ax<sup>2</sup> + bx + c = 0</span>
</p>

<p>
    <b><u>Tin học:</u></b>
    <i>Vòng lặp For</i>.
</p>

<pre style="background-color: #CCCCCC; color: #0000CC;">
        For i = 0 To 10

                Tong = Tong + 1

        Next
</pre>

</body>
</html>
